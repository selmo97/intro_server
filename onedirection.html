<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One Direction</title>
  </head>
  <body>
    <h1>YOU DON'T KNOW YOU'RE BEAUTIFUL!</h1>

    <!--api call/render one direction-->
    <script>
      async function getOneDirection() {
        try {
          const response = await fetch('/api/onedirection');
          const data = await response.json();
          console.log("Fetched data:", data);

          //render to page
          const list = document.createElement("ul");
          data.forEach(member=> {
            const li = document.createElement("li");
            li.textContent = member;
            list.appendChild(li);
          });
          document.body.appendChild(list);
        } catch (err) {
          console.error("💥 Error:", err);
        }
      }

      getOneDirection();
    </script>
  </body>
</html>
